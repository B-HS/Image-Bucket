name: Deploy Image Bucket

on:
  push:
    branches:
      - deploy-imagebucket

jobs:
  deploy-imagebucket:
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: ${{ secrets.IMAGEBUCKET_NAME }}
      HOST_IP:     ${{ secrets.HOST_IP }}
      HOST_USERNAME: ${{ secrets.HOST_USERNAME }}
      PROJECT_PORT: ${{ secrets.IMAGEBUCKET_PORT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Save Image (Docker Buildx)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.PROJECT_NAME }} .
          docker save ${{ env.PROJECT_NAME }} -o ${{ env.PROJECT_NAME }}.tar

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v0.1.8
        with:
          host:     ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port:     ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p Desktop/containers/${{ env.PROJECT_NAME }}

      - name: Transfer image tar to remote
        uses: appleboy/scp-action@v0.1.3
        with:
          host:     ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port:     ${{ secrets.SERVER_PORT }}
          source:   ./${{ env.PROJECT_NAME }}.tar
          target:   Desktop/containers/${{ env.PROJECT_NAME }}

      - name: Deploy via colima nerdctl on remote
        uses: appleboy/ssh-action@v0.1.8
        with:
          host:     ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port:     ${{ secrets.SERVER_PORT }}
          script: |
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            cd Desktop/containers/${{ env.PROJECT_NAME }}

            # 이전 이미지 제거
            old=$(colima nerdctl -- images -q ${{ env.PROJECT_NAME }}:latest)
            [ -n "$old" ] && colima nerdctl -- rmi -f $old

            # 새 이미지 로드
            colima nerdctl -- load -i ${{ env.PROJECT_NAME }}.tar

            # 스택 내리고 올리기
            PROJECT_NAME=${{ env.PROJECT_NAME }} PROJECT_PORT=${{ env.PROJECT_PORT }} \
              colima nerdctl -- compose --env-file .env down
            PROJECT_NAME=${{ env.PROJECT_NAME }} PROJECT_PORT=${{ env.PROJECT_PORT }} \
              colima nerdctl -- compose --env-file .env up -d

      - name: Cleanup local tar
        run: rm ${{ env.PROJECT_NAME }}.tar